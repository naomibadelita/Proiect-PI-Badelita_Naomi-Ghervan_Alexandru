paths:
  image_dir: "dataset/raw/images/train"
  image_dirp: "dataset/preprocessed/images/train"
  labels_dir: "dataset/raw/labels/train"
  labels_dirp: "dataset/preprocessed/labels/train"
  imageVal_dir: "dataset/raw/images/val"
  imageVal_dirp: "dataset/preprocessed/images/val"
  labelsVal_dir: "dataset/raw/labels/val"
  labelsVal_dirp: "dataset/preprocessed/labels/val"

train:
  epochs: 60
  batchsize: 8
  imgsz: 640
  patience: 15
  lr0: 0.001
  lrf: 0.01            # LR final = lr0*lrf (cosine)
  warmup_epochs: 3
  weight_decay: 0.01   # AdamW; doar pe greutati, nu pe BN/bias
  device: 0
  workers: 2
  seed: 42

# augmentari aplicate DOAR pe train (vezi src/data/dataset.py)
augment:
  fliplr: 0.5      # probabilitate flip orizontal
  hsv_h: 0.015     # jitter nuanta (fractie)
  hsv_s: 0.5       # jitter saturatie
  hsv_v: 0.3       # jitter luminozitate
  scale: 0.4       # zoom aleator in [1-scale, 1+scale]
  translate: 0.1   # deplasare aleatoare (fractie din imgsz)
  min_box_frac: 0.25  # se pastreaza cutiile din care a ramas cel putin 25% dupa decupare
