paths:
  image_dir: "dataset/raw/images/train"
  labels_dir: "dataset/raw/labels/train"
  imageVal_dir: "dataset/raw/images/val"
  labelsVal_dir: "dataset/raw/labels/avl"

train:
  epochs: 60
  batchsize: 8
  imgsz: 640
  patience: 15
  lr0: 0.001
  lrf: 0.01            
  warmup_epochs: 3
  weight_decay: 0.01  
  device: 0
  workers: 2
  seed: 42


augment:
  fliplr: 0.5    
  hsv_h: 0.015    
  hsv_s: 0.5     
  hsv_v: 0.3      
  scale: 0.4     
  translate: 0.1   
  min_box_frac: 0.25 
